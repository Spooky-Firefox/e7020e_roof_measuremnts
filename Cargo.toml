[package]
name = "e7020e_roof_control_hub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
crossbeam-channel = "0.5"
cpu-time = "1.0"
env_logger = "0.11"
log = "0.4"
opencv = "0.98.2"
prometheus = "0.14.x"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.8.1"
tiny_http = "0.12"

[build-dependencies]
pkg-config = "0.3"

[features]
default = ["camera-support", "no-display"]
camera-support = []
no-display = []
