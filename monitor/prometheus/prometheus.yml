# Embedded default: 1 s is enough for operator telemetry while reducing
# CPU, write load, and TSDB churn on the Rock Pi.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: roof_alignment
    static_configs:
      - targets:
          - host.docker.internal:9090
        labels:
          instance: rockpi4