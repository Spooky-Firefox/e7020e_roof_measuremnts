apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: e7012e-roof-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/e7012e_roof_measuremnts.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: e7012e-roof
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
